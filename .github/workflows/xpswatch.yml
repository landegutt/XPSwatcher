name: XPS Watcher

on:
  schedule:
    - cron: '0 */3 * * *'
  workflow_dispatch:

jobs:
  watch:

    runs-on: ubuntu-latest

    permissions:
      contents: write

    steps:

      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run watcher
        env:
          PUSHOVER_USER: ${{ secrets.PUSHOVER_USER }}
          PUSHOVER_TOKEN: ${{ secrets.PUSHOVER_TOKEN }}
        run: python watch_calendar.py

      - name: Commit updated state
        run: |
          git config user.name "XPSWatcher"
          git config user.email "actions@github.com"

          git add events.json

          git diff --staged --quiet || git commit -m "Update calendar state"

          git pull --rebase origin main || true
          git push || true
